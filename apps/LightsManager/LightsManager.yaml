LightManagerV2.ManagerConfig:
  NdUserId: ef606e2918da4355ba036a019cdcc6a0
  GuardTimeout: 300
  MinDuration: "0.00:03:00"
  MaxDuration: "0.00:20:00"
  RandomSwitchEntity: alarm_control_panel.alarmo
  Rooms:
    - Name: Study
      Timeout: 300
      OverrideTimeout: 1800
      PresenceEntities:
        - binary_sensor.office_motion
      KeepAliveEntities:
        - binary_sensor.eugenes_macbook_active
        - binary_sensor.haileys_macbook_air_active
        - binary_sensor.eugene_desktop_active
      ControlEntities:
        - light.office
      MonitorEntities:
        - light.office_1
        - light.office_2
      NightTimeEntity: input_select.house_mode
      NightTimeEntityStates:
        - night
        - sleeping
      NightControlEntities:
        - light.office
      LuxlimitEntity: input_number.office_lux_limit
      LuxEntity: sensor.office_lux
      # CircadianSwitchEntity: switch.adaptive_lighting_study
      RandomStates:
        - armed_home
        - armed_away
      # debug: true

    - Name: Dining
      PresenceEntities:
        - binary_sensor.dining_motion
        - binary_sensor.konnected_kitchen
      ControlEntities:
        - light.dining
      MonitorEntities:
        - light.dining        
      Timeout: 300
      NightTimeout: 90
      LuxEntity: sensor.dining_lux
      LuxlimitEntity: input_number.dining_lux_limit
      NightTimeEntity: input_select.house_mode
      NightTimeEntityStates:
        - night
        - sleeping
      NightControlEntities:
        - light.dining
      # CircadianSwitchEntity: switch.adaptive_lighting_dining
      RandomStates:
        - armed_home
        - armed_away
      # debug: true

