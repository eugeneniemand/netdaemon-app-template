      ControlEntities:
        - light.landing
      NightTimeEntity: input_select.house_mode
      NightTimeEntityStates:
        - night
        - sleeping
      NightControlEntities:
        - light.landing
      Timeout: 90
      LuxEntity: sensor.landing_lux
      LuxlimitEntity: input_number.landing_lux_limit
